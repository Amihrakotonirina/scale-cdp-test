<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDP API — README</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --code-bg: #f3f4f6;
            --link: #0b3d91;
            --brand: #0b3d91;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.6;
        }

        /*  Header  */
        .app-header {
            background: linear-gradient(135deg, #0b3d91 0%, #1e5fc2 100%);
            color: #fff;
            padding: 1rem 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .app-header__inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .app-header__title { margin: 0; font-size: 1.15rem; font-weight: 600; }
        .app-header__actions { display: flex; gap: .5rem; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .45rem .85rem;
            border-radius: 6px;
            font-size: .85rem;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid transparent;
            transition: background .15s;
        }
        .btn--ghost {
            background: rgba(255,255,255,.12);
            color: #fff;
            border-color: rgba(255,255,255,.25);
        }
        .btn--ghost:hover { background: rgba(255,255,255,.22); }

        /*  Contenu  */
        .readme {
            max-width: 900px;
            margin: 2rem auto 4rem;
            padding: 0 1.5rem;
        }

        /* Styles Markdown  */
        .readme h1, .readme h2, .readme h3, .readme h4 {
            margin-top: 2rem;
            margin-bottom: .75rem;
            font-weight: 600;
            line-height: 1.3;
        }
        .readme h1 {
            font-size: 2rem;
            padding-bottom: .5rem;
            border-bottom: 2px solid var(--border);
        }
        .readme h2 {
            font-size: 1.4rem;
            padding-bottom: .35rem;
            border-bottom: 1px solid var(--border);
        }
        .readme h3 { font-size: 1.15rem; }
        .readme p { margin: .75rem 0; }
        .readme a { color: var(--link); text-decoration: none; }
        .readme a:hover { text-decoration: underline; }

        .readme code {
            background: var(--code-bg);
            padding: .15rem .35rem;
            border-radius: 4px;
            font-size: .88em;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }
        .readme pre {
            background: #1f2937;
            color: #e5e7eb;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
            font-size: .85rem;
            line-height: 1.5;
        }
        .readme pre code {
            background: none;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }

        .readme ul, .readme ol { padding-left: 1.5rem; }
        .readme li { margin: .25rem 0; }

        .readme table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
        }
        .readme table th, .readme table td {
            border: 1px solid var(--border);
            padding: .5rem .75rem;
            text-align: left;
        }
        .readme table th {
            background: var(--code-bg);
            font-weight: 600;
        }

        .readme blockquote {
            border-left: 4px solid var(--brand);
            margin: 1rem 0;
            padding: .5rem 1rem;
            background: #f9fafb;
            color: var(--muted);
        }

        .readme hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2rem 0;
        }

        .readme img { max-width: 100%; }

        /*  Loading / Error  */
        #readme-container:empty::before {
            content: "Loading README…";
            display: block;
            text-align: center;
            color: var(--muted);
            padding: 3rem 0;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-header__inner">
            <h1 class="app-header__title">README — CDP API</h1>
            <div class="app-header__actions">
                <a class="btn btn--ghost" href="/docs">Swagger UI</a>
                <a class="btn btn--ghost" href="/">Home</a>
            </div>
        </div>
    </header>

    <main class="readme" id="readme-container"></main>

    <!-- marked.js : Markdown → HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script>
        (async function () {
            const container = document.getElementById('readme-container');
            try {
                // Fetch the raw README.md
                const res = await fetch('/README.md');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const md = await res.text();

                // Render Markdown → HTML
                container.innerHTML = marked.parse(md, {
                    gfm: true,        // GitHub Flavored Markdown (tables, task lists)
                    breaks: false,    // pas de <br> sur saut de ligne simple
                    headerIds: true,  // ancres pour les titres
                    mangle: false,
                    highlight: null
                });

                // Add target="_blank" to external links
                container.querySelectorAll('a[href^="http"]').forEach(a => {
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                });
            } catch (e) {
                container.innerHTML = `
                    <div style="text-align:center;padding:3rem 1rem;color:#b91c1c">
                        <h2>Failed to load README</h2>
                        <p>${e.message}</p>
                        <p><a href="/README.md">Open raw README.md</a></p>
                    </div>`;
            }
        })();
    </script>
</body>
</html>
