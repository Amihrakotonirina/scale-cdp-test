services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: cdp_test
      DB_USER: cdp_user
      DB_PASSWORD: cdp_dev_password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cdp_test
      MYSQL_USER: cdp_user
      MYSQL_PASSWORD: cdp_dev_password
      MYSQL_ROOT_PASSWORD: cdp_root_password
    ports:
      - "3307:3306"
    volumes:
      - cdp_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcdp_root_password"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  cdp_mysql_data:
